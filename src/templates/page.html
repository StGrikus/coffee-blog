<!doctype html>
<html lang="ru">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    {{GOOGLE_SITE_VERIFICATION_META}}
    <title>{{SITE_TITLE}}</title>
    <meta name="description" content="{{SITE_TAGLINE}}" />
    <link rel="canonical" href="{{CANONICAL_URL}}" />

    <meta property="og:title" content="{{SITE_TITLE}}" />
    <meta property="og:description" content="{{SITE_TAGLINE}}" />
    <meta property="og:type" content="website" />
    <meta property="og:url" content="{{CANONICAL_URL}}" />

    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:title" content="{{SITE_TITLE}}" />
    <meta name="twitter:description" content="{{SITE_TAGLINE}}" />
    <link rel="icon" type="image/svg+xml" href="{{BASE_PATH}}assets/favicon.svg" />
    <link rel="stylesheet" href="{{BASE_PATH}}assets/theme.css" />
    <link rel="stylesheet" href="{{BASE_PATH}}assets/styles.css" />
    <script defer src="{{BASE_PATH}}assets/app.js"></script>
  </head>
  <body>
    <div class="container">
      <header class="site-header">
        <div>
          <h1 class="site-title">
            <a href="{{BASE_PATH}}">{{SITE_TITLE}}</a>
          </h1>
          <p class="site-tagline">{{SITE_TAGLINE}}</p>
        </div>
      </header>

      <main class="posts">
        {{POST_LIST}}
      </main>

      {{PAGINATION}}
    </div>
  </body>
</html>
